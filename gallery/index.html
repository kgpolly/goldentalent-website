<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a2a6c">
    <meta name="description" content="goldentalent 产品画廊展示">
    <title>GoldenTalent Product</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="shortcut icon" href="./favicon.png">
    <link rel="stylesheet" type="text/css" href="./css/font-awesome.css">
    <link rel="stylesheet" type="text/css" href="./css/lightbox.min.css">
    <link rel="stylesheet" type="text/css" href="./css/iconfont.css">
    <link rel="stylesheet" href="./css/root.css">
</head>
<body>

<header>
    <!--<div class="logo-img">
        <img src="./img/logo.png" alt="" style="width: 15%">产品一览
    </div>-->
    <div class="logo-img">
        <img src="./img/logo.png" alt="" style="width: 30%">
    </div>
    <div class="logo">产品一览</div>
    <!--<div class="logo">
        产品一览
    </div>-->
    <!--产品一览-->
    <!--<div class="subtitle">探索世界之美</div>-->
</header>

<div class="container" id="container">
    <div class="gallery" id="gallery">
        <!-- bootstrap.js加载 -->
    </div>
    <div class="footer">
        <footer>
            <p>
                Copyright © 2025. Goldentalent ALL RIGHTS RESERVED. <a href="https://beian.miit.gov.cn/"> 沪ICP备2025119322号-1</a>
            </p>
            <a href="../assets/download/H51F0B3EF.apk" download="GoldenTalent.apk" class="main-btn">
                <i class="fas fa-download" style="align-items: center"></i>
            </a>
        </footer>
    </div>

</div>

<!-- Lightbox结构 -->
<div class="lightbox" id="lightbox">
    <div class="close-btn" onclick="closeLightbox()">
        <i class="fas fa-times"></i>
    </div>
    <div class="nav-btn prev-btn" onclick="changeSlide(-1)">
        <i class="fas fa-chevron-left"></i>
    </div>
    <div class="nav-btn next-btn" onclick="changeSlide(1)">
        <i class="fas fa-chevron-right"></i>
    </div>
    <div class="lightbox-content">
        <div class="lightbox-image-container">
            <div class="lightbox-slider" id="lightbox-slider">
                <!-- 幻灯片将通过JS动态添加 -->
            </div>
            <div class="lightbox-counter" id="lightbox-counter">1 / 3</div>

            <!-- 缩略图容器 - 放置在大图下方 -->
            <div class="lightbox-thumbnails-container">
                <div class="lightbox-thumbnails" id="lightbox-thumbnails">
                    <!-- 缩略图将通过JS动态添加 -->
                </div>
            </div>
        </div>
        <div class="lightbox-info">
            <h2 class="lightbox-title" id="lightbox-title"></h2>
            <div class="lightbox-description" id="lightbox-description"></div>

            <!-- 移动端提示 -->
            <p class="mobile-only" style="color: var(--sk-glyph-gray-tertiary-alpha); font-size: 0.9rem; margin-top: 50px; text-align: center;">
                <i class="iconfont icon-zuoyouhuadong"></i>
                左右滑动切换图片
            </p>
            <!--<div class="lightbox-thumbnails" id="lightbox-thumbnails">
                &lt;!&ndash; 缩略图将通过JS动态添加 &ndash;&gt;
            </div>-->
        </div>
    </div>
</div>
<script src="./js/bootstrap.js"></script>
<script src="./js/lightbox.js"></script>
<script src="./js/pwa.js"></script>
</body>
</html>
